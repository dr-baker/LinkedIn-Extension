<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JD Extractor</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="bg-orbs" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
  </div>

  <div class="container">
    <header class="header glass">
      <div class="logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="24" height="24" rx="5" fill="#0A66C2"/>
          <path d="M8.5 17H6V10H8.5V17ZM7.25 9C6.56 9 6 8.44 6 7.75C6 7.06 6.56 6.5 7.25 6.5C7.94 6.5 8.5 7.06 8.5 7.75C8.5 8.44 7.94 9 7.25 9ZM18 17H15.5V13.5C15.5 12.67 14.83 12 14 12C13.17 12 12.5 12.67 12.5 13.5V17H10V10H12.5V11.13C13.07 10.42 13.97 10 15 10C16.66 10 18 11.34 18 13V17Z" fill="white"/>
        </svg>
        <h1>JD Extractor</h1>
      </div>
      <div class="header-actions">
        <button id="refresh-btn" class="icon-btn" title="Refresh">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
        </button>
        <a href="settings.html" class="icon-btn" title="Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </a>
      </div>
    </header>

    <div id="action-bar" class="action-bar glass hidden">
      <div id="completeness" class="completeness" title="Extraction completeness">
        <span class="completeness-dot"></span>
        <span class="completeness-text">—</span>
      </div>
      <div class="action-bar-buttons">
        <button id="copy-btn" class="btn btn-primary" title="Copy as text">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          Copy
        </button>
        <button id="download-btn" class="btn btn-ghost" title="Download JSON">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Download
        </button>
      </div>
    </div>

    <div id="status-banner" class="status-banner hidden">
      <span class="status-icon"></span>
      <span class="status-text"></span>
    </div>

    <main class="content">
      <div id="not-supported" class="message-box hidden">
        <div class="message-icon">🔗</div>
        <p>Navigate to a LinkedIn or BuiltIn job page to extract job details.</p>
      </div>

      <div id="no-job" class="message-box hidden">
        <div class="message-icon">📋</div>
        <p>Open a job listing to see its details here.</p>
      </div>

      <div id="job-data" class="job-data hidden">
        <section class="job-header">
          <h2 id="job-title" class="job-title">-</h2>
          <div class="job-meta">
            <span id="company-name" class="company">-</span>
            <span class="separator">•</span>
            <span id="location" class="location">-</span>
            <span class="separator applicants-sep hidden">•</span>
            <span id="applicants" class="applicants hidden"></span>
          </div>
        </section>

        <div class="info-grid">
          <div class="info-card" data-field="salary">
            <span class="info-label">Salary</span>
            <span id="salary" class="info-value">-</span>
          </div>
          <div class="info-card" data-field="workType">
            <span class="info-label">Work Type</span>
            <span id="work-type" class="info-value">-</span>
          </div>
          <div class="info-card" data-field="applicants">
            <span class="info-label">Applicants</span>
            <span id="applicant-count" class="info-value">-</span>
          </div>
          <div class="info-card" data-field="postedDate">
            <span class="info-label">Posted</span>
            <span id="posted-date" class="info-value">-</span>
          </div>
        </div>

        <section class="description-section" data-field="description">
          <div class="section-head">
            <h3>Description</h3>
            <span class="field-status" id="description-status"></span>
          </div>
          <div id="description" class="description-content">-</div>
        </section>

        <section class="collapsible skills-section" id="skills-section" data-field="skills" data-collapsed="true">
          <button type="button" class="section-head section-toggle">
            <span class="head-left">
              <h3>Skills</h3>
              <span class="field-status" id="skills-status"></span>
            </span>
            <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
          <div class="section-body">
            <div id="skills" class="skills-tags"></div>
          </div>
        </section>

        <section class="collapsible benefits-section" id="benefits-section" data-field="benefits" data-collapsed="true">
          <button type="button" class="section-head section-toggle">
            <span class="head-left">
              <h3>Benefits</h3>
              <span class="field-status" id="benefits-status"></span>
            </span>
            <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
          <div class="section-body">
            <div id="benefits" class="benefits-list"></div>
          </div>
        </section>

        <section class="collapsible company-desc-section" id="company-desc-section" data-field="companyDescription" data-collapsed="true">
          <button type="button" class="section-head section-toggle">
            <span class="head-left">
              <h3>About the company</h3>
              <span class="field-status" id="company-desc-status"></span>
            </span>
            <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
          <div class="section-body">
            <div id="company-description" class="company-desc-content"></div>
          </div>
        </section>
      </div>

      <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <p>Extracting job data...</p>
      </div>
    </main>
  </div>

  <script src="popup.js"></script>
</body>
</html>
